name: ci

# Fast profile (SPEC §19): fmt, check, clippy, test, plus dependency license and advisory
# checks with cargo-deny (policy in deny.toml). Read-only token, GitHub-owned
# actions only. Until the Cargo workspace exists (RER-F-001) every job reports
# "no Cargo.toml" and passes, so this workflow can be a required status check.
on:
  push:
    branches: [main, "rer/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: detect Cargo workspace
        run: |
          if [ -f Cargo.toml ]; then echo "cargo=true" >> "$GITHUB_OUTPUT"; else echo "cargo=false" >> "$GITHUB_OUTPUT"; echo "no Cargo.toml yet: nothing to build"; fi

      - name: toolchain
        if: steps.detect.outputs.cargo == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version && cargo --version

      - uses: actions/cache@v4
        if: steps.detect.outputs.cargo == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain*', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        if: steps.detect.outputs.cargo == 'true'
        run: cargo fmt --all --check

      - name: cargo check
        if: steps.detect.outputs.cargo == 'true'
        run: cargo check --all-targets --all-features --locked

      - name: cargo clippy
        if: steps.detect.outputs.cargo == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # cargo-nextest runs each test in its own process and writes a JUnit report (.config/nextest.toml, profile ci). The
      # report is uploaded as the `test-report` artifact, which the RER pipeline reads to name failing and flaky tests.
      # The version is pinned like cargo-deny below; the cache keeps the build to the first run.
      - uses: actions/cache@v4
        if: steps.detect.outputs.cargo == 'true'
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ runner.os }}-0.9.148

      - name: install cargo-nextest
        if: steps.detect.outputs.cargo == 'true'
        run: command -v cargo-nextest >/dev/null || cargo install cargo-nextest --locked --version 0.9.148

      - name: cargo nextest run
        if: steps.detect.outputs.cargo == 'true'
        run: cargo nextest run --all-features --locked --profile ci

      # nextest does not run documentation tests.
      - name: cargo test --doc
        if: steps.detect.outputs.cargo == 'true'
        run: cargo test --doc --all-features --locked

      - name: upload test report
        if: always() && steps.detect.outputs.cargo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 30

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: detect Cargo workspace
        run: |
          if [ -f Cargo.toml ]; then echo "cargo=true" >> "$GITHUB_OUTPUT"; else echo "cargo=false" >> "$GITHUB_OUTPUT"; echo "no Cargo.toml yet: nothing to check"; fi

      - uses: actions/cache@v4
        if: steps.detect.outputs.cargo == 'true'
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-v1

      - name: install cargo-deny
        if: steps.detect.outputs.cargo == 'true'
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked

      - name: cargo deny check
        if: steps.detect.outputs.cargo == 'true'
        run: cargo deny --all-features check advisories bans licenses sources
