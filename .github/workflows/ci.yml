name: ci

# Fast profile (SPEC §19): fmt, check, clippy, test. Read-only token, GitHub-owned
# actions only. Until the Cargo workspace exists (RER-F-001) every job reports
# "no Cargo.toml" and passes, so this workflow can be a required status check.
on:
  push:
    branches: [main, "rer/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: detect Cargo workspace
        run: |
          if [ -f Cargo.toml ]; then echo "cargo=true" >> "$GITHUB_OUTPUT"; else echo "cargo=false" >> "$GITHUB_OUTPUT"; echo "no Cargo.toml yet: nothing to build"; fi

      - name: toolchain
        if: steps.detect.outputs.cargo == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version && cargo --version

      - uses: actions/cache@v4
        if: steps.detect.outputs.cargo == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain*', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        if: steps.detect.outputs.cargo == 'true'
        run: cargo fmt --all --check

      - name: cargo check
        if: steps.detect.outputs.cargo == 'true'
        run: cargo check --all-targets --all-features --locked

      - name: cargo clippy
        if: steps.detect.outputs.cargo == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        if: steps.detect.outputs.cargo == 'true'
        run: cargo test --all-features --locked
