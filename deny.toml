# cargo-deny policy for RER (SPEC §3, §17, §19; CONTRIBUTING.md "Licensing of Contributions").
# Owner-controlled: automated agents may not edit this file (rer-wm-pipeline denylist).

[graph]
all-features = true

[advisories]
version = 2
# Any RustSec vulnerability or unmaintained/unsound advisory fails CI; yanked crates too.
yanked = "deny"

[licenses]
version = 2
# Permissive licenses compatible with Apache-2.0 only; copyleft (GPL, AGPL, LGPL, MPL) is not allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
