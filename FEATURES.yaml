      - In crates/rer/tests/mavlink_integration_tests.rs, forwarding multiplexed MAVLink streams from two distinct system and component identifier pairs preserves independent sequence continuity counters without emitting false sequence gap events.
      - In crates/rer/src/relay.rs, receiving a malformed or truncated MAVLink packet on an inspected stream drops the packet by default, increments dropped packet counters, and emits a dropped diagnostic event.
      - In crates/rer/src/relay.rs, receiving a malformed MAVLink packet on an inspected stream configured with option passthrough_on_error forwards the payload unmodified to destination endpoints while recording a validation failure event.
      - In crates/rer/src/relay.rs, forwarding traffic on a stream without MAVLink inspection configured delivers datagrams byte-identically without invoking MAVLink parsing overhead.

