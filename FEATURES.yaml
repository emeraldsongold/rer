  - id: RER-F-008
    order: 8
    phase: Diagnostics
    title: Structured diagnostic events and production, debug and test modes
    priority: P2
    risk: medium
    autonomy: deferred
    notes: >-
      Superseded by RER-F-026, RER-F-027 and RER-F-028 (2026-10-14). Four attempts at the whole task all timed out at the 60
      minute limit; the criteria below are now spread over those three smaller tasks. Nothing depends on this item any more.
    depends_on: [RER-F-007]
    spec_refs: ["§8", "§10"]
    test_profile: standard
    acceptance:
      - Production mode emits no per-packet logs or payload contents by default and always reports failures and health transitions.
      - Debug mode emits per-packet receive, classify, route and send events with stream IDs, timestamps, endpoints and lengths.
      - Test mode collects events for a bounded run with correlation IDs and reverts after its configured expiry.
      - Event buffers and rates are bounded, and dropped diagnostic events are counted and reported.
      - Events distinguish received, accepted, routed or queued, send attempted and send succeeded (§8 stages 2-6).
      - Emitting diagnostics never blocks the forwarding path (tested under load).

