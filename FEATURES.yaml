  - id: RER-F-046
    order: 46
    title: In-tree SRT packet header parser
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-044]
    spec_refs: [§8, §13, §14]
    test_profile: standard
    notes: 'Part 1 of 4 of one request. Implement RER-F-044 as an optional SRT (Secure Reliable Transport) packet inspection feature, improving debugging without compromising RER''s core relay functionality. Requirements Parse the 16-byte SRT header, distinguishing data and control packets. Extract available metadata, including sequence numbers, socket IDs, and control types. Integrate with InspectionConfig and the existing non-blocking diagnostics buffer. Inspection must be disabled by default, avoid unnecessary allocations, and never block forwarding. Extend the impairment harness to test SRT traffic under deterministic packet loss, reordering, and jitter, using external SRT endpoints where practical. Add tests for valid packets, truncated headers, malformed extensions, unknown types, boundary conditions, and byte-for-byte forwarding. Recommendations Treat packets as untrusted input. Enforce bounds checks and prevent panics, excessive processing, and diagnostic-buffer exhaustion. Distinguish observed metadata from inferred connection state. Passive inspection cannot verify successful handshakes, encryption, or retransmission recovery. Avoid logging encryption keys or unnecessarily exposing sensitive identifiers. Benchmark throughput and latency with inspection enabled and disabled. Keep SRT termination, encryption management, and full protocol implementation out of scope; consider them separately if justified. Acceptance Criteria: Inspection is opt-in; existing relay behavior remains unchanged; packets are forwarded unmodified; malformed traffic cannot crash the relay; diagnostics remain bounded and non-blocking; and automated tests pass. Implement the minimal parser first, followed by diagnostics integration and impairment testing. This delivers practical debugging value while controlling complexity. Relevant code: crates/rer/src/config.rs, docs/proposals/RER-F-044.md, crates/rer/src/diagnostics.rs.'
    acceptance:
      - In crates/rer/src/srt.rs, parsing a 16-byte buffer with packet type bit 0 extracts data packet sequence number, message number, timestamp, and destination socket ID.
      - In crates/rer/src/srt.rs, parsing a 16-byte buffer with packet type bit 1 extracts control type, type-specific information, timestamp, and destination socket ID.
      - In crates/rer/src/srt.rs, parsing an input buffer shorter than 16 bytes returns an error indicating truncated header.
      - In crates/rer/src/srt.rs, parsing an SRT Handshake control packet extracts handshake type, protocol version, and initial sequence number.
      - In crates/rer/src/srt.rs, evaluating arbitrary non-SRT payload bytes returns a parse status distinguishing non-SRT traffic from valid SRT packets without panicking.

