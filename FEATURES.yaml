      - In crates/rer/src/relay.rs, forwarding a UDP datagram containing a valid LTP segment records an LtpInspection diagnostic event with extracted session identifier in the diagnostic buffer while forwarding the datagram unmodified.
      - When an inspected stream receives non-LTP datagram traffic, the relay forwards the payload unmodified and records a diagnostic event indicating unparsed traffic without interrupting relay operation.
