# RER roadmap: structured source of truth (schema v1).
#
# Converted from docs/SPEC.md §20 (implementation sequence). Acceptance criteria
# are drawn from the sections listed in each item's spec_refs plus the §21
# definition of done. ROADMAP.md is generated from this file; do not edit it
# by hand.
#
# Owner controls (`autonomy`): ready-auto | investigate-only |
# needs-design-approval | needs-impl-approval | blocked | deferred | no-auto.
# A status here is only ever advanced with linked evidence (merged PR + CI run);
# a roadmap entry existing does not mean the feature exists (§18).
schema_version: 1
project: rer
items:
  - id: RER-F-001
    order: 1
    phase: Foundation
    title: Repository bootstrap, project policy, architecture, CI and license confirmation
    type: infra
    priority: P1
    risk: low
    autonomy: ready-auto
    approvals_required: [license]
    spec_refs: ["§1", "§3", "§18", "§19", "§22"]
    test_profile: fast
    acceptance:
      - A Cargo workspace builds in GitHub Actions on hosted Linux runners; no local compilation is required.
      - CI runs cargo fmt --check, cargo check, cargo clippy --all-targets --all-features -- -D warnings and cargo test on every push and pull request.
      - README.md, AGENTS.md, ARCHITECTURE.md, DECISIONS.md, KNOWN_ISSUES.md, PLATFORM_SUPPORT.md, CONTRIBUTING.md, SECURITY.md and CHANGELOG.md exist and describe only implemented behavior.
      - The owner's confirmation of Apache-2.0 is recorded before LICENSE and NOTICE are finalized.
      - Dependency license and advisory checks run in CI with free tooling.
      - CI caches are keyed on Cargo.lock and the toolchain version.
    notes: The repository already contains a GitHub-generated Apache-2.0 LICENSE; it is not treated as confirmed until the owner approves (§3).

  - id: RER-F-002
    order: 2
    phase: Foundation
    title: Configuration model and validation
    priority: P1
    risk: medium
    autonomy: ready-auto
    depends_on: [RER-F-001]
    spec_refs: ["§7", "§17"]
    test_profile: standard
    acceptance:
      - A documented YAML configuration format exists with example configurations.
      - rer validate reports each invalid field with its path and reason and exits non-zero on failure.
      - Unknown fields, conflicting settings and duplicate instance or stream identities are rejected.
      - Validation output is available as JSON for automation.
      - Effective-configuration output never prints secret values.
      - A configuration schema is maintained and checked in CI.
    notes: "A file whose path contains 'secret' or 'credential' is accepted only as .rs or .md. CI workflow files are owner-controlled: cover the schema with a cargo test that validates every example against it, and list the CI wiring itself under unmet_criteria."

  - id: RER-F-003
    order: 3
    phase: Core relay
    title: Basic UDP relay with unit and integration tests
    priority: P1
    risk: medium
    autonomy: ready-auto
    depends_on: [RER-F-002]
    spec_refs: ["§5", "§17"]
    test_profile: standard
    acceptance:
      - UDP-to-UDP forwarding preserves datagram boundaries and payload bytes, verified by loopback integration tests.
      - All queues are bounded; the overload drop policy is documented and every drop is counted, never silent.
      - Unavailable destinations and socket errors are counted and reported without stopping the relay.
      - Graceful startup and shutdown on SIGINT and SIGTERM is tested.
      - rer run only starts from a configuration that passes validation.

