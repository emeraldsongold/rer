  - id: RER-F-022
    order: 22
    phase: Core relay
    title: Strict validation of IP addresses, hostnames and ports in endpoint configuration
    type: feature
    priority: P2
    risk: low
    autonomy: ready-auto
    depends_on: [RER-F-002]
    spec_refs: ["§5", "§7", "§17"]
    test_profile: standard
    notes: Hardens the endpoint check from RER-F-002, which today validates the port but not the host. Syntax only; IPv6 behaviour at run time belongs to RER-F-023 and zone handling to RER-F-024.
    acceptance:
      - An endpoint address is `host:port` where host is an IPv4 literal, a bracketed IPv6 literal such as `[::1]` or a syntactically valid hostname; anything else is rejected by `rer validate` with the field path and a reason.
      - A bracketed IPv6 literal may carry a zone identifier such as `[fe80::1%eth0]` or `[fe80::1%2]`; an empty zone, a zone containing whitespace or control characters, or a zone longer than 15 bytes is rejected.
      - A port must be an integer from 1 to 65535; 0, negative, above 65535, empty and non-numeric ports are each rejected with their own message.
      - Malformed addresses are rejected before any socket call, including `999.1.1.1:80`, `1.2.3:80`, `[::1:80`, the unbracketed `::1:80`, hosts containing spaces or control characters, hostnames longer than 253 bytes, labels longer than 63 bytes and labels starting or ending with `-`.
      - Unix-domain-socket paths keep their current handling and are not run through host validation.
      - Validation is offline and deterministic, so it performs no name lookup and no interface lookup.
      - Each accepted and rejected class above has a table-driven unit test, and `rer run` refuses to start on every rejected class.

  - id: RER-F-023
    order: 23
    phase: Core relay
    title: IPv6 support for relay endpoints
    type: feature
    priority: P2
    risk: medium
    autonomy: ready-auto
    depends_on: [RER-F-005, RER-F-022]
    spec_refs: ["§5", "§13", "§17"]
    test_profile: standard
    notes: The UDP sender already keeps an IPv6 socket, but IPv6 listeners, TCP and tests do not exist and nothing documents it. The agent sandbox has no IPv6 loopback (`::1` cannot be bound, measured 2026-10-12), so IPv6 integration tests cannot run there and CI is the evidence; write them to skip with a visible reason when `::1` is unavailable and do not weaken them to pass. Adding the `socket2` crate is approved by the owner; deny.toml is owner controlled and must not be edited.
    acceptance:
      - Source and destination endpoints accept bracketed IPv6 literals (`[::1]:5000`) for UDP and TCP in all four transport combinations, and IPv4-only configurations behave exactly as before.
      - Loopback integration tests forward IPv4 to IPv6 and IPv6 to IPv4, and fan out to destinations of mixed families, with payload bytes and datagram boundaries preserved.
      - IPv6 listeners set IPV6_V6ONLY explicitly, so `[::]` accepts IPv6 only and `0.0.0.0` accepts IPv4 only on every platform; dual-stack is two explicit endpoints, and a test proves an IPv4 client cannot reach an `[::]` listener.
      - Socket options are set through the `socket2` crate, added as a workspace dependency with a pinned version requirement and a committed Cargo.lock; it passes `cargo deny` without any change to deny.toml, and if that is not possible the agent stops and reports it as an unmet criterion.
      - A hostname that resolves to both families uses a documented selection rule, and an unresolvable or unreachable destination is counted and reported without stopping the other destinations.
      - Where IPv6 loopback is unavailable the integration tests skip with a visible reason; they never pass silently.
      - Diagnostic output and the management API show IPv6 endpoints in bracketed form.
      - PLATFORM_SUPPORT.md and the configuration documentation state exactly what IPv6 support is tested; nothing further is claimed.

  - id: RER-F-024
    order: 24
    phase: Core relay
    title: Scoped IPv6 addresses with zone identifiers
    type: feature
    priority: P3
    risk: medium
    autonomy: ready-auto
    depends_on: [RER-F-023]
    spec_refs: ["§5", "§17"]
    test_profile: standard
    notes: Split from RER-F-023 so each task stays small enough for one attempt. The `libc` crate is already a dependency, and `unsafe` is already used in signals.rs, so `libc::if_nametoindex` is acceptable. The agent sandbox has no IPv6 loopback, so the integration test is CI evidence only.
    acceptance:
      - Zone identifiers in `[fe80::1%eth0]:5000` and the numeric form `[fe80::1%2]:5000` work for UDP and TCP sources and destinations, with an interface name resolved to its index and applied as the scope id of the socket address.
      - An unknown interface name is reported with the configuration path and the name, at startup for a source and as a counted destination error for a destination, and never as a silent failure.
      - A zone on an address that does not need one is passed to the operating system and any refusal is reported, not hidden.
      - Parsing and formatting round-trip the zone, and diagnostic output and the management API show it unchanged.
      - Unit tests cover parsing, formatting and error cases offline, and a loopback integration test exercises a scoped address where the platform allows it and skips with a visible reason otherwise.
      - PLATFORM_SUPPORT.md states what scoped-address behaviour is tested and that link-local addresses on real network interfaces are not covered by CI.

  - id: RER-F-025
    order: 25
    phase: Core relay
    title: Traffic receiver counts unique packets, so duplicated packets no longer hide the last originals
    type: test
    priority: P2
    risk: low
    autonomy: ready-auto
    depends_on: [RER-F-004]
    spec_refs: ["§13"]
    test_profile: standard
    notes: >-
      Found by the first pipeline simulation on 2026-10-13 (main at ced935e). With 10% duplication the harness reported
      95 lost packets (sequences 905 to 999) although the relay had forwarded all 1000. Cause in crates/rer/src/sim/receiver.rs
      — listen_udp and listen_tcp stop reading when total_received reaches expected_count, and total_received counts
      duplicate copies, so the receiver quits after 905 originals and 95 copies. Fix the stop condition only. The relay is not
      at fault. Keep received_count as the number of datagrams read, keep the idle timeout, and keep the current meaning of
      pass (duplicates still make it false). The unit tests must not depend on timing.
    acceptance:
      - The UDP receiver and the TCP receiver finish when every expected sequence number has been seen once, or when the idle timeout elapses, never because the number of datagrams read reached expected_count.
      - A stream of expected_count originals interleaved with duplicate copies, with the copies arriving before the last originals, reports lost_count 0, unique_received_count equal to expected_count and duplicate_count equal to the copies read before the last original.
      - A stream with a genuinely missing sequence still reports it in lost_sequences and still ends at the idle timeout.
      - The harness duplicate scenario (duplication rate 10%, 1000 packets, fixed seed) reports lost_count 0 and a duplicate_count above 0, and a test asserts both.
      - The report fields and the meaning of pass are unchanged for streams without duplicates, shown by the existing receiver tests passing unmodified.
      - CHANGELOG.md records the fix and KNOWN_ISSUES.md lists no loss-accounting caveat that this removes.

  - id: RER-F-026
    order: 26
    phase: Diagnostics
    title: Diagnostic event model with a bounded, non-blocking event buffer
    type: feature
    priority: P2
    risk: medium
    autonomy: ready-auto
    depends_on: [RER-F-007]
    spec_refs: ["§8", "§10"]
    test_profile: standard
    notes: >-
      First of three slices that replace RER-F-008 (RER-F-026, RER-F-027, RER-F-028). A self-contained library module with unit
      tests and no change to the relay, the CLI or the management API. Add crates/rer/src/diagnostics.rs and export it from
      lib.rs. Tests must not sleep or read the wall clock: inject the clock. Build with CARGO_PROFILE_DEV_DEBUG=0 and
      CARGO_INCREMENTAL=0, and run the workspace tests once.
    acceptance:
      - A new module crates/rer/src/diagnostics.rs defines a serializable event carrying a monotonic timestamp, a wall-clock timestamp, the stream ID, a stage, an optional source and destination endpoint, the transport, the payload length, an optional correlation ID and an optional reason. The event type has no field that can hold payload bytes.
      - The stage enum names the received, accepted, routed-or-queued, send-attempted and send-succeeded stages of §8 (stages 2 to 6) and also dropped, failure and health-transition events, and serializes to stable snake_case strings that a test pins.
      - The event buffer has a configured capacity. When it is full the oldest event is overwritten and a dropped-event counter increases. A snapshot returns the events in arrival order together with the dropped count.
      - Emitting never blocks. When another thread holds the buffer, the emit call returns at once, the event is counted as dropped, and a test shows this with a thread that holds the buffer.
      - A per-second rate limit with an injected clock counts the events it rejects as dropped, and a test crosses a second boundary without sleeping.
      - Existing tests pass unmodified, no other module changes behaviour, and CHANGELOG.md records the new module.

  - id: RER-F-027
    order: 27
    phase: Diagnostics
    title: Production and debug modes emit diagnostic events from the forwarding path
    type: feature
    priority: P2
    risk: medium
    autonomy: ready-auto
    depends_on: [RER-F-026]
    spec_refs: ["§8", "§10"]
    test_profile: standard
    notes: >-
      Second slice of the RER-F-008 split. Use the event buffer from RER-F-026 and the existing OperationalMode (production,
      debug, test). Test mode is RER-F-028: here it behaves like debug. The relay already prints failures with eprintln in
      crates/rer/src/relay.rs and management.rs: keep those lines (production must still report failures) and add the
      matching events beside them. Do not change the forwarding logic itself.
    acceptance:
      - In debug mode the stream runner emits one event per packet for each of the received, accepted, routed-or-queued, send-attempted and send-succeeded stages, with the stream ID, endpoints, transport and payload length.
      - In production mode no per-packet event and no per-packet log line is produced, and a test asserts the buffer holds none after traffic has been forwarded.
      - In every mode a destination error, socket error, queue drop and stream health transition produces an event with a reason, and the existing stderr lines are unchanged.
      - No event or log line contains payload bytes, shown by a test that forwards a distinctive payload and searches the serialized events for it.
      - Diagnostics never block forwarding, shown by a test that forwards a flood of packets through a buffer of capacity 8, delivers every packet, and reports a dropped-event count above zero.
      - Existing relay and management tests pass unmodified, and KNOWN_ISSUES.md no longer lists packet diagnostics as missing for the stages implemented here.

  - id: RER-F-028
    order: 28
    phase: Diagnostics
    title: Test mode with correlation IDs, and recent events through the management API
    type: feature
    priority: P2
    risk: medium
    autonomy: ready-auto
    depends_on: [RER-F-027]
    spec_refs: ["§9", "§10"]
    test_profile: standard
    notes: >-
      Third slice of the RER-F-008 split. Mode and expiry come from configuration; changing the mode at runtime is out of
      scope. Add the read-only operation beside the existing ones in management.rs and classify it as read-only like the
      other status operations. Leave the "rer diagnose is not yet implemented" message alone. If a criterion cannot be met,
      report it as unmet rather than weakening the test.
    acceptance:
      - Test mode records events for a bounded run, and every event of the run carries the run's correlation ID taken from configuration.
      - A test-mode run ends at its configured expiry and the instance returns to the diagnostic level it had before, shown with an injected clock and no sleeping.
      - A run is bounded in events and in duration, both with documented maximums, and a run that reaches a bound ends and records why.
      - The management API has a read-only operation that returns the most recent events (a bounded limit, newest last), the dropped-event count and the current mode with its expiry.
