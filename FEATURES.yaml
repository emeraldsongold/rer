    order: 77
    title: Modbus and DNP3 relay forwarding integration and ingress filtering
    type: feature
    priority: P2
    risk: medium
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-076]
    spec_refs: [§5, §8, §14]
    test_profile: standard
    notes: 'Part 4 of 4 of one request. Implement RER-F-068 as a modular, zero-dependency Modbus TCP and DNP3 framing and inspection feature, preserving RER''s role as a transparent engineering relay. Requirements Add Modbus TCP MBAP framing with length validation, transaction IDs, unit IDs, function codes, and exception detection. Add DNP3 FT3 framing with sync detection, CRC validation, station addresses, control flags, and transport/application metadata. Integrate optional address/function-code filtering and diagnostics with existing configuration and relay pipelines. Add comprehensive tests for malformed frames, partial TCP reads, CRC failures, sequence rollover, filtering, and graceful shutdown. Recommendations Implement Modbus TCP framing first as the smallest independently testable milestone. Restrict initial Modbus support to standard MBAP encapsulation; consider RTU-over-TCP separately. Inspect DNP3 link frames independently initially. Defer application-fragment reassembly until a clear diagnostic requirement justifies its buffering complexity. On DNP3 corruption, use bounded byte-by-byte resynchronization with strict size limits and diagnostic counters rather than immediately terminating every connection. Start with explicit address/function-code allowlists; defer range and wildcard syntax. Keep configurations consistent with existing top-level protocol configuration patterns. Preserve zero external dependencies, bounded memory, and byte-for-byte forwarding. Never execute SCADA commands or emulate PLCs. Acceptance Criteria: Framing handles TCP fragmentation correctly, malformed input cannot crash the relay, CRC and length validation are tested, filtering is predictable, and existing relay behavior remains unchanged when inspection is disabled. Implement Modbus first, followed by DNP3 framing, CRC validation, diagnostics, and filtering. This staged approach adds valuable industrial telemetry visibility without turning RER into a SCADA controller. Relevant code: crates/rer/src/framing.rs, crates/rer/src/config.rs, crates/rer/src/diagnostics.rs.'
    acceptance:
      - In crates/rer/src/relay.rs, forwarding a valid Modbus TCP packet on a stream with Modbus inspection enabled transmits the payload unmodified to destination endpoints while recording Modbus metadata in diagnostic events.
      - In crates/rer/src/relay.rs, receiving a Modbus packet with a unit ID not matching the configured unit ID allowlist drops the packet and increments dropped packet counters.
      - In crates/rer/src/relay.rs, receiving a malformed Modbus packet on an inspected stream drops the packet by default and increments dropped packet counters.
      - In crates/rer/src/relay.rs, receiving a malformed Modbus packet on an inspected stream configured with option passthrough_on_error forwards the payload unmodified to destination endpoints while recording a validation failure event.
      - In crates/rer/src/relay.rs, receiving a DNP3 packet with a destination address not matching the configured destination allowlist drops the packet and increments dropped packet counters.
      - In crates/rer/src/relay.rs, forwarding traffic on a stream without industrial protocol inspection configured delivers datagrams byte-identically without invoking Modbus or DNP3 parsing overhead.

