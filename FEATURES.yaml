  - id: RER-F-074
    order: 74
    title: In-tree Modbus TCP header parser and stream framing
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-068]
    spec_refs: [§5, §8, §14]
    test_profile: standard
    notes: 'Part 1 of 4 of one request. Implement RER-F-068 as a modular, zero-dependency Modbus TCP and DNP3 framing and inspection feature, preserving RER''s role as a transparent engineering relay. Requirements Add Modbus TCP MBAP framing with length validation, transaction IDs, unit IDs, function codes, and exception detection. Add DNP3 FT3 framing with sync detection, CRC validation, station addresses, control flags, and transport/application metadata. Integrate optional address/function-code filtering and diagnostics with existing configuration and relay pipelines. Add comprehensive tests for malformed frames, partial TCP reads, CRC failures, sequence rollover, filtering, and graceful shutdown. Recommendations Implement Modbus TCP framing first as the smallest independently testable milestone. Restrict initial Modbus support to standard MBAP encapsulation; consider RTU-over-TCP separately. Inspect DNP3 link frames independently initially. Defer application-fragment reassembly until a clear diagnostic requirement justifies its buffering complexity. On DNP3 corruption, use bounded byte-by-byte resynchronization with strict size limits and diagnostic counters rather than immediately terminating every connection. Start with explicit address/function-code allowlists; defer range and wildcard syntax. Keep configurations consistent with existing top-level protocol configuration patterns. Preserve zero external dependencies, bounded memory, and byte-for-byte forwarding. Never execute SCADA commands or emulate PLCs. Acceptance Criteria: Framing handles TCP fragmentation correctly, malformed input cannot crash the relay, CRC and length validation are tested, filtering is predictable, and existing relay behavior remains unchanged when inspection is disabled. Implement Modbus first, followed by DNP3 framing, CRC validation, diagnostics, and filtering. This staged approach adds valuable industrial telemetry visibility without turning RER into a SCADA controller. Relevant code: crates/rer/src/framing.rs, crates/rer/src/config.rs, crates/rer/src/diagnostics.rs.'
    acceptance:
      - In crates/rer/src/modbus.rs, parsing a 7-octet MBAP header with transaction ID 1, protocol ID 0, length 6, unit ID 1, and function code 3 returns an MbapHeader with matching fields.
      - In crates/rer/src/modbus.rs, parsing an MBAP header with a protocol ID other than 0 returns an error rejecting invalid protocol identifiers.
      - In crates/rer/src/modbus.rs, parsing an MBAP header declaring a length less than 2 or greater than 254 returns an error indicating an out-of-range length field.
      - In crates/rer/src/modbus.rs, parsing a frame with function code 0x83 and exception code 0x02 identifies an exception response with illegal data address.
      - In crates/rer/src/framing.rs, reading a Modbus frame fragmented across multiple 1-byte reads reassembles the complete frame matching the transmitted payload bytes.
      - In crates/rer/src/framing.rs, reading a Modbus frame declaring a length exceeding max_frame_size returns an invalid data error without allocating the declared length.

  - id: RER-F-075
    order: 75
    title: In-tree DNP3 FT3 stream framing and CRC validation
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-074]
    spec_refs: [§5, §8, §14]
    test_profile: standard
    notes: 'Part 2 of 4 of one request. Implement RER-F-068 as a modular, zero-dependency Modbus TCP and DNP3 framing and inspection feature, preserving RER''s role as a transparent engineering relay. Requirements Add Modbus TCP MBAP framing with length validation, transaction IDs, unit IDs, function codes, and exception detection. Add DNP3 FT3 framing with sync detection, CRC validation, station addresses, control flags, and transport/application metadata. Integrate optional address/function-code filtering and diagnostics with existing configuration and relay pipelines. Add comprehensive tests for malformed frames, partial TCP reads, CRC failures, sequence rollover, filtering, and graceful shutdown. Recommendations Implement Modbus TCP framing first as the smallest independently testable milestone. Restrict initial Modbus support to standard MBAP encapsulation; consider RTU-over-TCP separately. Inspect DNP3 link frames independently initially. Defer application-fragment reassembly until a clear diagnostic requirement justifies its buffering complexity. On DNP3 corruption, use bounded byte-by-byte resynchronization with strict size limits and diagnostic counters rather than immediately terminating every connection. Start with explicit address/function-code allowlists; defer range and wildcard syntax. Keep configurations consistent with existing top-level protocol configuration patterns. Preserve zero external dependencies, bounded memory, and byte-for-byte forwarding. Never execute SCADA commands or emulate PLCs. Acceptance Criteria: Framing handles TCP fragmentation correctly, malformed input cannot crash the relay, CRC and length validation are tested, filtering is predictable, and existing relay behavior remains unchanged when inspection is disabled. Implement Modbus first, followed by DNP3 framing, CRC validation, diagnostics, and filtering. This staged approach adds valuable industrial telemetry visibility without turning RER into a SCADA controller. Relevant code: crates/rer/src/framing.rs, crates/rer/src/config.rs, crates/rer/src/diagnostics.rs.'
    acceptance:
      - In crates/rer/src/dnp3.rs, parsing a 10-octet FT3 header with sync octets 0x05 and 0x64, length 5, control 0xC0, destination address 1, and source address 2 validates the header CRC and extracts the link header fields.
      - In crates/rer/src/dnp3.rs, calculating the 16-bit CRC over an 8-octet header using polynomial 0xA653 with inverted output produces the matching expected CRC value.
      - In crates/rer/src/dnp3.rs, parsing a frame with an invalid header CRC returns an error indicating CRC verification failure.
      - In crates/rer/src/dnp3.rs, parsing an FT3 user data block containing transport control octet 0xC0 extracts first segment flag FIR, final segment flag FIN, and transport sequence number 0.
      - In crates/rer/src/framing.rs, reading from a TCP stream containing leading noise bytes before sync octets 0x05 and 0x64 scans through up to a bounded limit to synchronize on the valid FT3 frame.
      - In crates/rer/src/framing.rs, reading a DNP3 frame declaring a length exceeding max_frame_size returns an invalid data error without allocating the declared frame size.

