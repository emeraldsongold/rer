    notes: 'Part 4 of 4 of one request. Implement RER-F-045 as an optional, zero-dependency MAVLink inspection and framing module supporting MAVLink 1 and 2. Requirements Parse MAVLink headers, message IDs, system/component IDs, sequence numbers, and optional signatures without modifying forwarded packets. Track sequence continuity independently per (sysid, compid) to prevent false packet-loss alerts on multiplexed streams. Support native MAVLink TCP framing using self-delimiting frames, configurable alongside existing framing modes. Integrate metadata and sequence-loss events with RER''s existing diagnostics system. Keep inspection opt-in and non-blocking. Add comprehensive tests for both versions, signed packets, truncated/malformed frames, sequence wraparound, multiplexed sources, and TCP streams split across reads. Recommendations Preserve byte-for-byte forwarding; malformed input must never crash or stall the relay. Treat unknown MAVLink 2 incompatibility flags as an inspection/validation warning, not permission to silently alter or drop traffic. Do not claim CRC verification without the correct dialect-specific CRC_EXTRA definitions. Distinguish sequence gaps from confirmed packet loss; duplicates, reordering, and counter wraparound require careful handling. Benchmark throughput and memory overhead. Keep autopilot control, message modification, and signing-key management out of scope. Acceptance Criteria: MAVLink 1/2 parsing works correctly, per-source sequence tracking produces accurate diagnostics, TCP framing handles fragmented and coalesced frames, malformed traffic is handled safely, and existing relay behavior remains unchanged when inspection is disabled. Implement the parser first, followed by sequence tracking, TCP framing, and integration tests. This provides useful UAV telemetry debugging while preserving RER''s role as a transparent engineering relay. Relevant code: crates/rer/src/config.rs, crates/rer/src/framing.rs, crates/rer/src/diagnostics.rs.'
    acceptance:
