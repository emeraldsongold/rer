  - id: RER-F-056
    order: 56
    title: In-tree MQTT fixed header parser and variable-byte integer codec
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-054]
    spec_refs: [§5, §8, §14]
    test_profile: standard
    notes: 'Part 1 of 4 of one request. Implement RER-F-054 as a modular, zero-dependency MQTT inspection and framing feature supporting MQTT 3.1.1 and 5.0, with MQTT-SN support staged separately. **Requirements** 1. Implement an in-tree parser for fixed headers, packet types, flags, and variable-length integers. 2. Add opt-in MQTT TCP framing that handles fragmented reads, concatenated packets, and configurable maximum frame sizes. 3. Integrate packet metadata and validation errors with RER''s existing non-blocking diagnostics. 4. Add comprehensive tests covering all packet types, length boundaries, malformed headers, truncated frames, and forwarding behavior. **Recommendations** - Keep MQTT-SN separate from standard MQTT configuration or clearly isolate it through an explicit protocol variant, since its framing and transport differ. - On malformed TCP framing, terminate the affected stream by default. Avoid heuristic resynchronization that could misidentify payload bytes as headers. - Keep topic extraction disabled by default; if added, enforce length limits and redact sensitive topic data where appropriate. - Do not use MQTT packet identifiers as generic sequence numbers. Their meaning depends on QoS exchanges and session state. - Enforce packet-size limits before allocation and preserve existing relay behavior when inspection is disabled. - Report successful local transmission as ''Forwarded'', never as proof of downstream receipt or broker acceptance. **Scope:** No broker functionality, subscription routing, persistence, TLS termination, or application-payload decoding. **Acceptance Criteria:** Zero new dependencies, bounded memory use, correct framing, safe malformed-packet handling, accurate diagnostics, and passing automated tests. Implement the parser and tests first, then TCP framing and diagnostics. Add MQTT-SN only after standard MQTT support is stable. This delivers useful IoT and telemetry debugging while keeping RER lightweight and transparent. Relevant code: crates/rer/src/config.rs, crates/rer/src/framing.rs, crates/rer/src/diagnostics.rs.'
    acceptance:
      - In crates/rer/src/mqtt.rs, decoding a variable byte integer from byte buffer [0x80, 0x01] returns a decoded value of 128 and 2 bytes consumed.
      - In crates/rer/src/mqtt.rs, decoding a variable byte integer containing 5 consecutive bytes with the continuation bit set returns an error indicating length overflow beyond 4 octets.
      - In crates/rer/src/mqtt.rs, parsing a fixed header with packet type 1 for CONNECT and flag bits 0b0001 returns an error rejecting non-zero flags.
      - In crates/rer/src/mqtt.rs, parsing a 2-byte PINGREQ packet with first byte 0xC0 and remaining length byte 0x00 returns an MqttFixedHeader with packet type 12, flags 0, remaining length 0, and total packet length 2.
      - In crates/rer/src/mqtt.rs, parsing a buffer shorter than the declared variable byte integer or declared remaining length returns an error indicating truncated packet data.
      - In crates/rer/src/mqtt.rs, parsing a byte buffer whose first byte has 4 high bits equal to 0 returns an error indicating forbidden packet type 0.

