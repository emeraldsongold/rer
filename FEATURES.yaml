  - id: RER-F-050
    order: 50
    title: In-tree MAVLink packet header parser
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-045]
    spec_refs: [§8, §14]
    test_profile: standard
    notes: 'Part 1 of 4 of one request. Implement RER-F-045 as an optional, zero-dependency MAVLink inspection and framing module supporting MAVLink 1 and 2. Requirements Parse MAVLink headers, message IDs, system/component IDs, sequence numbers, and optional signatures without modifying forwarded packets. Track sequence continuity independently per (sysid, compid) to prevent false packet-loss alerts on multiplexed streams. Support native MAVLink TCP framing using self-delimiting frames, configurable alongside existing framing modes. Integrate metadata and sequence-loss events with RER''s existing diagnostics system. Keep inspection opt-in and non-blocking. Add comprehensive tests for both versions, signed packets, truncated/malformed frames, sequence wraparound, multiplexed sources, and TCP streams split across reads. Recommendations Preserve byte-for-byte forwarding; malformed input must never crash or stall the relay. Treat unknown MAVLink 2 incompatibility flags as an inspection/validation warning, not permission to silently alter or drop traffic. Do not claim CRC verification without the correct dialect-specific CRC_EXTRA definitions. Distinguish sequence gaps from confirmed packet loss; duplicates, reordering, and counter wraparound require careful handling. Benchmark throughput and memory overhead. Keep autopilot control, message modification, and signing-key management out of scope. Acceptance Criteria: MAVLink 1/2 parsing works correctly, per-source sequence tracking produces accurate diagnostics, TCP framing handles fragmented and coalesced frames, malformed traffic is handled safely, and existing relay behavior remains unchanged when inspection is disabled. Implement the parser first, followed by sequence tracking, TCP framing, and integration tests. This provides useful UAV telemetry debugging while preserving RER''s role as a transparent engineering relay. Relevant code: crates/rer/src/config.rs, crates/rer/src/framing.rs, crates/rer/src/diagnostics.rs.'
    acceptance:
      - In crates/rer/src/mavlink.rs, parsing a buffer beginning with magic byte 0xFE extracts MAVLink 1 sequence number, system ID, component ID, 8-bit message ID, and total packet length calculated as payload length plus 8 bytes.
      - In crates/rer/src/mavlink.rs, parsing a buffer beginning with magic byte 0xFD without signature flag extracts MAVLink 2 sequence number, system ID, component ID, 24-bit little-endian message ID, and total packet length calculated as payload length plus 12 bytes.
      - In crates/rer/src/mavlink.rs, parsing a buffer beginning with magic byte 0xFD with incompatibility flag bit 0 set calculates total packet length as payload length plus 25 bytes.
      - In crates/rer/src/mavlink.rs, parsing an input buffer whose first byte is neither 0xFE nor 0xFD returns an error indicating an invalid magic marker.
      - In crates/rer/src/mavlink.rs, parsing an input buffer shorter than minimal header length or shorter than declared total packet length returns an error indicating a truncated packet.
      - In crates/rer/src/mavlink.rs, evaluating a MAVLink 2 packet with unknown incompatibility flag bits returns a parse warning while preserving extracted header metadata.

