  - id: RER-F-060
    order: 60
    title: KISS TCP stream framing support
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-055]
    spec_refs: [§5, §8, §14]
    test_profile: standard
    notes: 'Part 1 of 4 of one request. Implement RER-F-055 as a modular, zero-dependency KISS framing and AX.25 packet inspection feature for amateur radio, APRS, ground stations, and small-satellite telemetry. **Requirements** 1. Add ''FramingMode::Kiss'' to support KISS-over-TCP streams, handling fragmented reads, multiple frames, FEND delimiters, and escape sequences. 2. Parse AX.25 addresses, callsigns, SSIDs, digipeater paths, control fields, and PID where safely available. 3. Integrate KISS port, command type, frame classification, and address metadata into existing diagnostics. 4. Add comprehensive tests for valid frames, malformed escapes, truncated packets, oversized frames, and stream resynchronization. **Recommendations** - Enforce configurable frame-size limits and bounded buffering. Malformed frames must never crash or indefinitely stall the relay. - Keep passive inspection separate from KISS TNC control commands. Never transmit hardware configuration commands unless explicitly supported and authorized. - Make callsign filtering optional, with clear rules for frames that cannot be parsed. - Preserve transparent forwarding and distinguish malformed KISS framing from invalid AX.25 content. - Do not implement connected-mode AX.25, radio control, modem functionality, or APRS application decoding in this proposal. - Benchmark throughput and latency to ensure inspection introduces minimal overhead. **Acceptance Criteria:** KISS framing handles arbitrary TCP boundaries correctly; AX.25 metadata is extracted safely; malformed frames are handled predictably; diagnostics remain bounded and non-blocking; and existing relay behavior remains unchanged when inspection is disabled. Implement KISS framing first, then AX.25 parsing and diagnostics integration. This staged approach delivers practical packet-radio visibility while keeping RER lightweight and protocol-agnostic. Relevant code: crates/rer/src/config.rs, crates/rer/src/framing.rs, crates/rer/src/diagnostics.rs.'
    acceptance:
      - In crates/rer/src/framing.rs, reading from a TCP stream delivering a KISS frame fragmented across multiple 1-byte reads reassembles the complete unescaped frame matching the original transmitted payload bytes.
      - In crates/rer/src/framing.rs, reading from a TCP stream delivering two concatenated KISS frames separated by FEND delimiter byte 0xC0 in a single read buffer yields the two frames individually.
      - In crates/rer/src/framing.rs, reading from a TCP stream delivering an escaped sequence of 0xDB followed by 0xDC decodes byte 0xC0, and 0xDB followed by 0xDD decodes byte 0xDB.
      - In crates/rer/src/framing.rs, reading a KISS frame containing escape byte 0xDB followed by an unexpected byte returns an io::ErrorKind::InvalidData error.
      - In crates/rer/src/framing.rs, reading a KISS frame whose unescaped length exceeds the configured max_frame_size returns an io::ErrorKind::InvalidData error.
      - In crates/rer/src/config.rs, configuring option framing with value kiss deserializes into FramingMode::Kiss.

