  - id: RER-F-036
    order: 36
    title: In-tree CBOR parser for BPv7 primary blocks
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-019]
    spec_refs: [§14, §8]
    test_profile: standard
    notes: 'Part 1 of 3 of one request. Complete RER-F-019 with these decisions: 1. **Parser:** Use a lightweight, zero-dependency CBOR scanner for the BPv7 primary block. Keep it modular so an external crate such as ''bp7'' can be considered if future requirements expand. Enforce strict bounds checking and safe malformed-input handling. 2. **Configuration:** Add optional settings under ''stream.inspection.bpv7''. Inspection must be opt-in, preserve existing behavior when disabled, and enforce configurable limits on inspection size and extracted metadata. 3. **TCPCLv4:** Keep Phase 1 focused on transparent TCP/UDP relaying and passive BPv7 inspection. Defer TCPCLv4 session framing and negotiation to a future proposal with interoperability testing. 4. **Diagnostics:** Add a dedicated ''BundleInspection'' event in ''diagnostics.rs'' for structured bundle metadata and parse status. Ensure diagnostic handling is bounded and non-blocking. 5. **Milestone:** Approve changing the Phase 1 task in ''FEATURES.yaml'' from ''investigate-only'' to ''ready-auto'', subject to the defined scope and existing testing requirements. **Additional suggestions:** Inspection must never modify forwarded bytes or block relay workers. Distinguish malformed CBOR, valid non-BPv7 traffic, and valid BPv7 bundles. Test ''dtn:'' and ''ipn:'' EIDs, fragmentation metadata, CRC handling, truncated inputs, oversized values, and RFC 9171 reference vectors. Document that this is passive metadata inspection, not full BPv7 or TCPCLv4 support. Keep bundle storage, routing, BPSec verification, and convergence-layer implementation out of scope. Use established implementations such as ION or HDTN for integration testing where practical. Relevant code: crates/rer/src/config.rs, crates/rer/src/diagnostics.rs, crates/rer/src/relay.rs.'
    acceptance:
      - In crates/rer/src/bpv7.rs, parsing a valid CBOR primary block matching RFC 9171 reference vectors extracts the bundle protocol version 7, destination endpoint identifier, source node identifier, creation timestamp, and lifetime.
      - 'In crates/rer/src/bpv7.rs, parsing a primary block containing an ipn: scheme destination endpoint identifier and a dtn: scheme source node identifier returns both decoded URI strings.'
      - In crates/rer/src/bpv7.rs, parsing an input buffer shorter than the declared CBOR item lengths or truncated before the primary block completes returns an error indicating truncated input.
      - In crates/rer/src/bpv7.rs, parsing an RFC 9171 primary block with fragmentation flags set extracts the fragment offset and total application data unit length.
      - In crates/rer/src/bpv7.rs, evaluating arbitrary non-CBOR payload bytes returns a status distinguishing malformed CBOR from valid BPv7 bundle headers without panicking.

