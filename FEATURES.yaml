  - id: RER-F-039
    order: 39
    title: In-tree SDNV and LTP segment header parser
    type: feature
    priority: P2
    risk: low
    autonomy: needs-impl-approval
    approvals_required: []
    depends_on: [RER-F-020]
    spec_refs: [§14, §8, §13]
    test_profile: standard
    notes: 'Part 1 of 4 of one request. "I approve RER-F-020, implement the proposal with the following decisions:\n\n1. **Configuration:** Nest LTP settings under ''stream.inspection.ltp''. Keep inspection opt-in and preserve existing behavior when disabled.\n\n2. **Parser:** Implement an in-tree, zero-dependency SDNV and LTP header parser. Consider ''licklider-core'' only if future requirements justify full report-claim parsing or stateful LTP functionality.\n\n3. **Detection:** Require explicit per-stream configuration rather than automatically enabling inspection based on UDP port 1113. Port-based detection may be offered later as an optional convenience, never as a substitute for explicit configuration.\n\n4. **Contact schedules:** Start with deterministic relative millisecond outage windows for the simulation harness. Design the interface so CCSDS/ION contact plans can be imported later without coupling the core simulator to a specific format.\n\n5. **Diagnostics:** Use a dedicated ''LtpInspection'' diagnostic event or variant, integrated with existing packet diagnostics. Keep events bounded and non-blocking, and never modify forwarded datagrams.\n\n**Additional recommendations:** Complete Phase 1 with strict bounds checking, malformed/truncated SDNV tests, RFC 5326 reference vectors, and tests proving byte-identical forwarding. Ensure inspection distinguishes invalid LTP from ordinary non-LTP traffic without interrupting relay operation. Make outage timing deterministic and define whether packets are dropped or buffered during outages; default to dropping unless buffering is explicitly configured.\n\nKeep LTP session management, retransmission, persistent storage, security extensions, and full protocol compliance out of scope. Use ION or ''licklider'' as external integration-test peers where practical.\n\nApprove Phase 1 for implementation once these decisions are incorporated into the proposal and acceptance criteria." Relevant code: crates/rer/src/config.rs, crates/rer/src/diagnostics.rs, crates/rer/src/sim/channel.rs.'
    acceptance:
      - In crates/rer/src/ltp.rs, parsing a valid LTP data segment matching RFC 5326 reference vectors extracts version 0, segment type, session originator engine ID, session number, client service ID, offset, and length.
      - In crates/rer/src/ltp.rs, parsing an LTP checkpoint segment extracts the checkpoint serial number and report serial number.
      - In crates/rer/src/ltp.rs, decoding an SDNV value from an input buffer truncated before the continuation bit clears returns an error indicating truncated input.
      - In crates/rer/src/ltp.rs, parsing a segment header with a non-zero LTP version returns an error distinguishing invalid version from valid LTP version 0.
      - In crates/rer/src/ltp.rs, evaluating arbitrary non-LTP payload bytes returns a status distinguishing non-LTP traffic from valid LTP segments without panicking.

