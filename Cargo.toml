[workspace]
resolver = "2"
members = [
    "crates/rer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Ronald Edward Reeves Jr"]
repository = "https://github.com/emeraldsongold/rer"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
serde_json = "1.0"
serde_path_to_error = "0.1"
schemars = "0.8"
libc = "0.2"
socket2 = "=0.5.8"
